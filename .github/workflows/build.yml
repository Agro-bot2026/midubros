name: Build MiduBros APK
on:
  push: { branches: [main, master] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g8.zip
          unzip -q /tmp/g8.zip -d /tmp/g8
          /tmp/g8/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          export JAVA_HOME=$JAVA_HOME_17_X64
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiduBros-APK
          path: app/build/outputs/apk/debug/*.apk
